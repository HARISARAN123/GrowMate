<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Growmate - AI-Powered Farming Solutions 🌾 | Agriculture App</title>
    
    <meta name="description"
          content="Growmate is your AI-powered agricultural app that provides advanced tools for farm management, plant disease detection, crop optimization, and sustainable farming practices. Boost your farm’s productivity with AI-driven solutions.">
    <meta name="keywords"
          content="Growmate, agriculture app, AI farming, farm management, plant disease detection, crop optimization, precision farming, smart agriculture, sustainable farming, farming technology, AI agriculture, agriculture technology, farm productivity tools">
    <meta name="robots" content="index, follow">
    <meta property="og:title" content="Growmate - AI-Powered Agriculture Solutions 🌱 | Smart Farming Tools">
    <meta property="og:description"
          content="Growmate is an AI-powered app offering solutions for farm management, plant disease detection, and crop optimization. Empowering farmers with smart farming tools for higher productivity and sustainability.">
    <meta property="og:image" content="/static/growmate.jpg">
    <meta property="og:url" content="https://www.growmate.tech">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Growmate - AI-Powered Agriculture Solutions">
    <meta name="twitter:description" content="Growmate helps farmers optimize their farms with AI-driven tools for disease detection, crop management, and sustainability.">
    <meta name="twitter:image" content="/static/growmate.jpg">
    <link rel="canonical" href="https://www.growmate.tech">
    
    <title>Login - Growmate 🌱</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --brand-green: #2EA043;
            --dark-green: #216E2E;
            --light-green: #3FB950;
            --accent-green: #DAFBE1;
            --black: #1B1F24;
            --dark-gray: #2D333B;
            --light-gray: #F6F8FA;
            --white: #ffffff;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--light-gray);
            color: var(--black);
            line-height: 1.6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(rgba(27, 31, 36, 0.8), rgba(46, 160, 67, 0.8));
        }

        .login-container {
            background: var(--white);
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 450px;
            padding: 3rem;
            text-align: center;
        }

        .logo {
            font-size: 2rem;
            font-weight: 700;
            color: var(--brand-green);
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .form-group {
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: var(--dark-gray);
        }

        .form-group input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--dark-gray);
            border-radius: 8px;
            font-size: 1rem;
            transition: var(--transition);
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--brand-green);
            box-shadow: 0 0 0 3px rgba(46, 160, 67, 0.2);
        }

        .login-button {
            background: var(--brand-green);
            color: var(--white);
            border: none;
            padding: 1rem;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }

        .login-button:hover {
            background: var(--dark-green);
            transform: translateY(-2px);
            box-shadow: 0 8px 15px rgba(46, 160, 67, 0.2);
        }

        .signup-link {
            margin-top: 1.5rem;
            text-align: center;
        }

        .signup-link a {
            color: var(--brand-green);
            text-decoration: none;
            font-weight: 600;
            transition: var(--transition);
        }

        .signup-link a:hover {
            color: var(--dark-green);
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .login-container {
                width: 95%;
                padding: 2rem 1.5rem;
            }

            .logo {
                font-size: 1.5rem;
            }
        }

               .flash-messages {
            margin-bottom: 1.5rem;
            text-align: center;
        }
        .flash-messages .success {
            background-color: #dafbe1;
            color: #2ea043;
            padding: 0.75rem;
            border-radius: 8px;
        }
        .flash-messages .error {
            background-color: #ffebe9;
            color: #cf222def;
            padding: 0.75rem;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            Growmate.tech 🌱
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div class="flash-messages">
                    {% for category, message in messages %}
                        <div class="{{ category }}">{{ message }}</div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        <form class="login-form" id="login-form" action="/login" method="post">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required placeholder="Enter your email" />
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required placeholder="Enter your password" />
            </div>
            <input type="hidden" id="idToken" name="idToken" />
            <button type="submit" class="login-button">Log In</button>
            <div style="margin: 1rem 0;">or</div>
            <button type="button" id="google-login" class="login-button" style="background:#fff;color:#1B1F24;border:1px solid #2EA043;display:flex;align-items:center;justify-content:center;gap:8px;">
                <img src="https://developers.google.com/identity/images/g-logo.png" alt="Google" style="width:20px;height:20px;"> Sign in with Google
            </button>
            <div class="signup-link">
                Don't have an account? <a href="/signup">Sign Up</a>
            </div>
        </form>
        <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
        <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
        <script>
        // Firebase config injected from Flask/Jinja2
        const firebaseConfig = {
            apiKey: "{{ firebase_api_key }}",
            authDomain: "{{ firebase_auth_domain }}",
            projectId: "{{ firebase_project_id }}",
            storageBucket: "{{ firebase_storage_bucket }}",
            messagingSenderId: "{{ firebase_messaging_sender_id }}",
            appId: "{{ firebase_app_id }}",
            measurementId: "{{ firebase_measurement_id }}"
        };
        
        console.log('Firebase Config:', firebaseConfig);
        
        try {
            firebase.initializeApp(firebaseConfig);
            const auth = firebase.auth();
            console.log('Firebase initialized successfully');
            
            document.getElementById('google-login').onclick = function(e) {
                e.preventDefault();
                const provider = new firebase.auth.GoogleAuthProvider();
                auth.signInWithPopup(provider).then(result => {
                    console.log('Google sign-in successful:', result.user.email);
                    return result.user.getIdToken();
                }).then(idToken => {
                    console.log('ID Token received:', idToken ? 'Yes' : 'No');
                    document.getElementById('idToken').value = idToken;
                    document.getElementById('login-form').submit();
                }).catch(error => {
                    console.error('Google sign-in error:', error);
                    alert('Google sign-in failed: ' + error.message);
                });
            };
            
            // Handle email/password login with Firebase and send idToken
            document.getElementById('login-form').onsubmit = function(e) {
                e.preventDefault();
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;
                
                if (!email || !password) {
                    alert('Please enter both email and password');
                    return;
                }
                
                console.log('Attempting email/password sign-in for:', email);
                auth.signInWithEmailAndPassword(email, password)
                    .then(userCredential => {
                        console.log('Email/password sign-in successful:', userCredential.user.email);
                        return userCredential.user.getIdToken();
                    })
                    .then(idToken => {
                        console.log('ID Token received:', idToken ? 'Yes' : 'No');
                        document.getElementById('idToken').value = idToken;
                        e.target.submit();
                    })
                    .catch(error => {
                        console.error('Email/password sign-in error:', error);
                        alert('Login failed: ' + error.message);
                    });
            };
        } catch (error) {
            console.error('Firebase initialization error:', error);
            alert('Firebase initialization failed. Please check console for details.');
        }
        </script>
    </div>
</body>
</html>
